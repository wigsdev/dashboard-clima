<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pcn-moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pcn-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="pcn-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Peeking Crescent Moon behind cloud -->
  <g transform="translate(2, -1)">
    <path d="M40 10 A 11 11 0 1 0 44 30 A 9.5 9.5 0 0 1 40 10 Z" 
          fill="url(#pcn-moon)"/>
    <circle cx="51" cy="11" r="1.3" fill="#fde047" opacity="0.85"/>
  </g>

  <!-- Main Cloud in front -->
  <path d="M18 48h28a10 10 0 0 0 2-19.8A13 13 0 0 0 23 27a9 9 0 0 0-5 21z" 
        fill="url(#pcn-cloud)" filter="url(#pcn-shadow)"/>
</svg>
