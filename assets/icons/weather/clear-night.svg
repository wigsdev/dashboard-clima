<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="moon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#facc15" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Glowing Crescent Moon -->
  <path d="M37 13 A 19 19 0 1 0 43 49 A 16 16 0 0 1 37 13 Z" 
        fill="url(#moon-grad)" 
        filter="url(#moon-glow)"/>

  <!-- Twinkling Stars -->
  <!-- Star 1: Sparkle -->
  <path d="M18 18 L19.2 21.5 L22.5 22.5 L19.2 23.5 L18 27 L16.8 23.5 L13.5 22.5 L16.8 21.5 Z" 
        fill="#fde047" opacity="0.9"/>
  <!-- Star 2: Top right small star -->
  <circle cx="50" cy="18" r="1.5" fill="#fef08a" opacity="0.85"/>
  <!-- Star 3: Bottom left small star -->
  <circle cx="21" cy="46" r="1.3" fill="#fef08a" opacity="0.75"/>
</svg>
