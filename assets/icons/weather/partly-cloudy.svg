<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pc-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pc-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="pc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Peeking Sun -->
  <g transform="translate(6, -2)">
    <circle cx="36" cy="22" r="10" fill="url(#pc-sun)"/>
    <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <line x1="36" y1="6" x2="36" y2="9"/>
      <line x1="50" y1="22" x2="53" y2="22"/>
      <line x1="46" y1="12" x2="48" y2="10"/>
      <line x1="26" y1="12" x2="24" y2="10"/>
    </g>
  </g>
  <!-- Cloud in front -->
  <path d="M18 48h28a10 10 0 0 0 2-19.8A13 13 0 0 0 23 27a9 9 0 0 0-5 21z" 
        fill="url(#pc-cloud)" filter="url(#pc-shadow)"/>
</svg>
