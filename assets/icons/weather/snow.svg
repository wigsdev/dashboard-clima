<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="snow-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="snow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Cloud -->
  <path d="M16 38h32a9 9 0 0 0 2-17.8A12 12 0 0 0 22 19a8 8 0 0 0-6 19z" 
        fill="url(#snow-cloud)" filter="url(#snow-shadow)"/>
  <!-- Snowflakes (asterisks) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <!-- Flake 1 -->
    <g transform="translate(20, 48)">
      <line x1="0" y1="-4" x2="0" y2="4"/>
      <line x1="-3.5" y1="-2" x2="3.5" y2="2"/>
      <line x1="-3.5" y1="2" x2="3.5" y2="-2"/>
    </g>
    <!-- Flake 2 -->
    <g transform="translate(32, 52)">
      <line x1="0" y1="-4" x2="0" y2="4"/>
      <line x1="-3.5" y1="-2" x2="3.5" y2="2"/>
      <line x1="-3.5" y1="2" x2="3.5" y2="-2"/>
    </g>
    <!-- Flake 3 -->
    <g transform="translate(44, 48)">
      <line x1="0" y1="-4" x2="0" y2="4"/>
      <line x1="-3.5" y1="-2" x2="3.5" y2="2"/>
      <line x1="-3.5" y1="2" x2="3.5" y2="-2"/>
    </g>
  </g>
</svg>
