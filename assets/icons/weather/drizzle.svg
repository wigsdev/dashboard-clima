<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="drizzle-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="drizzle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Cloud -->
  <path d="M16 38h32a9 9 0 0 0 2-17.8A12 12 0 0 0 22 19a8 8 0 0 0-6 19z" 
        fill="url(#drizzle-cloud)" filter="url(#drizzle-shadow)"/>
  <!-- Drizzle Droplets (dashed/slanted) -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5">
    <line x1="22" y1="44" x2="20" y2="54"/>
    <line x1="32" y1="44" x2="30" y2="54"/>
    <line x1="42" y1="44" x2="40" y2="54"/>
  </g>
</svg>
