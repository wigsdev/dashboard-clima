<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rain-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="rain-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Cloud -->
  <path d="M16 38h32a9 9 0 0 0 2-17.8A12 12 0 0 0 22 19a8 8 0 0 0-6 19z" 
        fill="url(#rain-cloud)" filter="url(#rain-shadow)"/>
  <!-- Rain Streaks -->
  <g stroke="#0284c7" stroke-width="3" stroke-linecap="round">
    <line x1="22" y1="44" x2="18" y2="54"/>
    <line x1="32" y1="44" x2="28" y2="56"/>
    <line x1="42" y1="44" x2="38" y2="54"/>
  </g>
</svg>
