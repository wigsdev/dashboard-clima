<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sh-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="sh-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="sh-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Sun -->
  <circle cx="42" cy="20" r="9" fill="url(#sh-sun)"/>
  <!-- Foreground Cloud -->
  <path d="M14 38h28a9 9 0 0 0 2-17.8A12 12 0 0 0 20 19a8 8 0 0 0-6 19z" 
        fill="url(#sh-cloud)" filter="url(#sh-shadow)"/>
  <!-- Intense Rain Droplets -->
  <g stroke="#0284c7" stroke-width="2.5" stroke-linecap="round">
    <line x1="20" y1="44" x2="16" y2="54"/>
    <line x1="28" y1="44" x2="24" y2="56"/>
    <line x1="36" y1="44" x2="32" y2="54"/>
  </g>
</svg>
