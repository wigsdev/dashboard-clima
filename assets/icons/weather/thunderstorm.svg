<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="storm-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="storm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Dark Storm Cloud -->
  <path d="M16 36h32a9 9 0 0 0 2-17.8A12 12 0 0 0 22 17a8 8 0 0 0-6 19z" 
        fill="url(#storm-cloud)" filter="url(#storm-shadow)"/>
  <!-- Lightning Bolt -->
  <polygon points="32 34 24 46 31 46 27 58 40 43 33 43" 
           fill="url(#lightning)" stroke="#d97706" stroke-width="1"/>
</svg>
