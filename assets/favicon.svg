<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="32" height="32" rx="8" fill="#0284c7"/>
  <!-- Sun -->
  <circle cx="21" cy="11" r="5" fill="url(#sun-grad)"/>
  <!-- Cloud -->
  <path d="M10 24h12a5 5 0 0 0 1.2-9.85A6.5 6.5 0 0 0 10.5 15a4.5 4.5 0 0 0-.5 9z" 
        fill="url(#cloud-grad)" filter="url(#shadow)"/>
</svg>
