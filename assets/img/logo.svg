<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logo-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="logo-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="logo-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="48" height="48" rx="12" fill="url(#logo-base)"/>
  <!-- Sun rays -->
  <circle cx="32" cy="16" r="7" fill="url(#logo-sun)"/>
  <!-- Cloud -->
  <path d="M14 36h19a7 7 0 0 0 2-13.7A9 9 0 0 0 17 22a6.5 6.5 0 0 0-3 14z" 
        fill="url(#logo-cloud)" filter="url(#logo-shadow)"/>
  <!-- Little Rain Drops or Sparkle -->
  <circle cx="20" cy="39" r="1.5" fill="#bae6fd"/>
  <circle cx="27" cy="39" r="1.5" fill="#bae6fd"/>
</svg>
